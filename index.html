<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Questionnaire augmentation mammaire | Dr Guillaume Karsenti</title>
  <meta name="description" content="Questionnaire d'orientation pour mieux comprendre les options d'augmentation mammaire : Preservé®, dual plan, composite ou mastopexie." />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/accueil" aria-label="Accueil du questionnaire">
      <span class="monogram">GK</span>
      <span class="brand-block"><strong>Dr Guillaume Karsenti</strong><em>Chirurgie esthétique mammaire</em></span>
    </a>
    <nav class="nav" aria-label="Navigation principale">
      <a href="https://drkarsenti.com" target="_blank" rel="noreferrer">Site principal</a>
      <a href="#/accueil">Questionnaire</a>
      <a href="https://www.doctolib.fr/" target="_blank" rel="noreferrer" class="rdv">Rendez-vous</a>
    </nav>
  </header>

  <main id="app" aria-live="polite"></main>

  <template id="screen-template">
    <section class="screen">
      <aside class="visual-panel" aria-hidden="true">
        <div class="visual-shell">
          <div class="visual-topline">
            <span class="chip">Orientation</span>
            <span class="step-pill"></span>
          </div>
          <div class="visual-illustration"></div>
          <div class="visual-copy">
            <p class="visual-kicker"></p>
            <h2 class="visual-title"></h2>
            <p class="visual-caption"></p>
          </div>
        </div>
      </aside>
      <section class="content-panel">
        <div class="content-inner">
          <button class="back" type="button">Retour</button>
          <p class="eyebrow"></p>
          <h1></h1>
          <p class="lead"></p>
          <div class="helper"></div>
          <div class="fields"></div>
          <div class="answers"></div>
          <p class="disclaimer"></p>
        </div>
      </section>
    </section>
  </template>

  <script src="app.js"></script>

</html>
